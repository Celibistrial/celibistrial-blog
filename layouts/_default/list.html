{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ with .Content }}{{ . }}{{ end }}
  <ul class="post-list">
    {{ range .Pages }}
      <li>
        <time class="post-date" datetime="{{ .Date.Format "2006" }}">{{ .Date.Format "? ? 2006" }}</time>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
    {{ end }}
  </ul>
{{ end }}
